<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>QR signs | SawHorse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,600..900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%231C232B%22/%3E%3Cg%20transform%3D%22translate%280%208%29%22%3E%3Cg%20stroke-linecap%3D%22round%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%3E%3Cpath%20d%3D%22M19%2016%20L15%2043%20M45%2016%20L49%2043%22%20stroke-width%3D%224.5%22%20opacity%3D%220.5%22/%3E%3Cpath%20d%3D%22M14%2016%20L6%2044%20M50%2016%20L58%2044%22%20stroke-width%3D%226%22/%3E%3Cpath%20d%3D%22M10%2032%20H54%22%20stroke-width%3D%224.5%22/%3E%3C/g%3E%3Crect%20x%3D%222%22%20y%3D%225%22%20width%3D%2260%22%20height%3D%2212%22%20rx%3D%222.5%22%20fill%3D%22%23F6C21C%22/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/styles.css?v=20260911a">
<style>
  .screen-only { max-width: 1000px; margin: 0 auto; padding: 20px 16px 0; }
  .screen-only p { max-width: 70ch; }
  .signs { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; max-width: 1000px; margin: 20px auto 60px; padding: 0 16px; }
  .sign {
    background: #fff; border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
    display: flex; flex-direction: column; aspect-ratio: 8.5 / 11;
  }
  .sign-band { background: var(--band); color: var(--band-ink); padding: 6% 7% 5%; }
  .sign-band .kicker { font: 600 clamp(12px, 2.4vw, 20px)/1.1 var(--body); margin: 0 0 2%; opacity: 0.9; }
  .sign-band h2 { font: 700 clamp(34px, 7vw, 72px)/0.95 var(--cond); margin: 0; }
  .sign-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 5% 8%; text-align: center; }
  .sign-body .qr { width: 72%; }
  .sign-body .qr svg { width: 100%; height: auto; display: block; }
  .sign-body .scan { font: 700 clamp(18px, 3.2vw, 30px)/1.15 var(--cond); margin: 5% 0 2%; }
  .sign-body .rules { font-size: clamp(11px, 1.8vw, 16px); margin: 0; color: var(--ink); max-width: 36ch; }
  .sign-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 6% 4%; }
  .sign-brand { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); flex: none; }
  .sign-brand .brand-mark { width: 26px; height: 20px; color: var(--ink); }
  .sign-brand b { font: 800 13px/1 var(--display); font-stretch: 125%; }
  .sign-url { font-size: clamp(8px, 1.2vw, 11px); color: var(--muted); text-align: right; word-break: break-all; }

  @media print {
    @page { size: letter portrait; margin: 0.4in; }
    body { background: #fff; }
    .screen-only { display: none; }
    .signs { display: block; margin: 0; padding: 0; max-width: none; }
    .sign { width: 7.7in; height: 10.2in; aspect-ratio: auto; border: 2px solid #1C232B; border-radius: 0; break-after: page; page-break-after: always; margin: 0 auto; }
    .sign:last-child { break-after: auto; page-break-after: auto; }
    .sign-band { -webkit-print-color-adjust: exact; print-color-adjust: exact; padding: 0.45in 0.5in 0.35in; }
    .sign-band .kicker { font-size: 20pt; }
    .sign-band h2 { font-size: 76pt; }
    .sign-body .qr { width: 4.6in; }
    .sign-body .scan { font-size: 28pt; }
    .sign-body .rules { font-size: 15pt; }
    .sign-url { font-size: 9pt; }
    .sign-brand .brand-mark { width: 0.45in; height: 0.34in; }
    .sign-brand b { font-size: 12pt; }
  }
</style>
</head>
<body>
<div class="brandbar screen-only">
  <div class="brandbar-inner">
    <a class="brand" href="./" aria-label="SawHorse, crew page"><svg class="brand-mark" viewBox="0 0 64 48" aria-hidden="true" focusable="false"><g stroke-linecap="round" fill="none" stroke="currentColor"><path d="M19 16 L15 43 M45 16 L49 43" stroke-width="4.5" opacity="0.5"/><path d="M14 16 L6 44 M50 16 L58 44" stroke-width="6"/><path d="M10 32 H54" stroke-width="4.5"/></g><rect x="2" y="5" width="60" height="12" rx="2.5" fill="#F6C21C"/><path d="M8 5v4.5M14 5v2.8M20 5v4.5M26 5v2.8M32 5v4.5M38 5v2.8M44 5v4.5M50 5v2.8M56 5v4.5" stroke="#1C232B" stroke-width="1.6"/></svg><span class="brand-name">SawHorse</span></a>
    <span class="brand-tag">Tackle, Track, Complete</span>
  </div>
</div>
<div class="screen-only">
  <div class="top-row">
    <h1>QR signs</h1>
    <p id="sync" class="sync" role="status" aria-live="polite" data-state="busy">Loading…</p>
  </div>
  <p>One sign for each area's stack, plus one for the saw station that opens the safety check-in. Scanning a stack sign opens the crew page on that area. The area dropdown is still there, so anyone can switch areas.</p>
  <div id="urlWarn" class="notice" hidden></div>
  <div class="top-actions">
    <button type="button" class="btn" onclick="window.print()">Print signs</button>
    <a class="btn-quiet" href="leadership.html">Back to leadership page</a>
  </div>
</div>

<div class="signs" id="signs"></div>

<script src="assets/config.js?v=20260911a"></script>
<script src="assets/demo-data.js?v=20260911a"></script>
<script src="assets/planner.js?v=20260911a"></script>
<script src="assets/common.js?v=20260911a"></script>
<script src="assets/qrcode.js?v=20260911a"></script>
<script>
(function () {
  const C = window.Cut;
  const base = new URL('./', location.href).href;
  const BRAND = document.querySelector('.brandbar .brand-mark').outerHTML;
  if (location.protocol === 'file:') {
    const w = document.getElementById('urlWarn');
    w.hidden = false;
    w.innerHTML = '<strong>Print these from your GitHub Pages site.</strong> This page is open from a file on your computer, so the codes point to that file and won\'t work on anyone\'s phone.';
  }

  function sign({ kicker, title, color, scan, rules, url }) {
    const hex = color ? C.tapeHex(color) : '#1C232B';
    return `<article class="sign" style="--band:${hex};--band-ink:${C.inkOn(hex)}">
      <div class="sign-band"><p class="kicker">${C.esc(kicker)}</p><h2>${C.esc(title)}</h2></div>
      <div class="sign-body">
        <div class="qr">${window.qrSVG(url, { label: 'QR code for ' + title })}</div>
        <p class="scan">${C.esc(scan)}</p>
        <p class="rules">${C.esc(rules)}</p>
      </div>
      <div class="sign-foot"><span class="sign-brand">${BRAND}<b>SawHorse</b></span><span class="sign-url">${C.esc(url)}</span></div>
    </article>`;
  }

  C.api.get('crew').then(d => {
    const html = d.sheets.map(sh => {
      const color = d.tape[sh.name] || '';
      return sign({
        kicker: color ? `${color} tape stack` : 'Stack',
        title: sh.name,
        color,
        scan: `Scan to open the ${sh.name} cut list`,
        rules: `Bundles here get ${color ? color.toLowerCase() : 'this area\'s'} tape. Longest bundles on the bottom, tape labels facing out.`,
        url: base + '#' + encodeURIComponent(sh.name)
      });
    });
    html.push(sign({
      kicker: 'Saw station', title: 'Safety check-in', color: '',
      scan: 'Scan before your first cut',
      rules: 'Glasses on. Hearing protection in. Vacuum running. No gloves at the saw.',
      url: base + '#safety'
    }));
    document.getElementById('signs').innerHTML = html.join('');
    C.setSync(document.getElementById('sync'), C.DEMO ? 'demo' : 'ok', C.DEMO ? 'Demo data' : `${d.sheets.length + 1} signs`);
  }).catch(err => {
    console.error(err);
    C.setSync(document.getElementById('sync'), 'err', "Can't reach the sheet. Reload to try again.");
  });
})();
</script>
</body>
</html>
